site_name: tydex
site_description: Typed decision primitives for LLMs — choice, score, and noul, returned as data with probabilities.
site_url: https://dracko000.github.io/tydex/
repo_url: https://github.com/Dracko000/tydex
edit_uri: blob/main/docs/

theme:
  name: material
  features:
    - navigation.top
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7

markdown_extensions:
  - admonition
  - toc:
      permalink: true

nav:
  - "Home": index.md
  - "API reference": api.md
  - "Interfaces": interfaces.md
  - "Calibration & routing": calibration.md
  - "Development": development.md